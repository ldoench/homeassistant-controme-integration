name: "Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4.1.7"

      - name: "Derive the release version"
        id: version
        shell: "bash"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: "Update the integration manifest version"
        shell: "bash"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("custom_components/controme/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = os.environ["RELEASE_VERSION"]
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: "Package the integration"
        shell: "bash"
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          cd "${{ github.workspace }}/custom_components/controme"
          zip -r "${{ github.workspace }}/dist/controme.zip" . \
            -x '__pycache__/*' '*/__pycache__/*'

      - name: "Create the GitHub release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: "bash"
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION}"
          NOTES_FILE="$(mktemp)"

          if [ -f CHANGELOG.md ]; then
            awk -v version="$VERSION_NO_V" '
              /^## / {
                heading = $0
                sub(/^## /, "", heading)
                gsub(/\r/, "", heading)
                sub(/[[:space:]]+\([^)]+\)$/, "", heading)
                if (heading == version || heading == "v" version) {
                  in_target = 1
                  next
                }
                if (in_target) exit
              }
              in_target { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi

          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Release %s\n' "$VERSION" > "$NOTES_FILE"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ github.workspace }}/dist/controme.zip" --clobber
            gh release edit "$TAG" --title "Release $VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${{ github.workspace }}/dist/controme.zip" \
              --title "Release $VERSION" \
              --notes-file "$NOTES_FILE"
          fi

          rm -f "$NOTES_FILE"
